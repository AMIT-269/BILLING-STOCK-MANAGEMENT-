name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Keep only the newest main build running so stale/stuck runs do not block validation.
concurrency:
  group: android-apk-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: BILLING-STOCK-MANAGEMENT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

