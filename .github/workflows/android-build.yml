name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: android-apk-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Run Robolectric test 2B-3 account identity
        run: >
          timeout 5m gradle testDebugUnitTest --no-daemon --stacktrace --console=plain --info
          -Dbilling.skipFirebaseNetworkTests=true
          --tests "com.example.ExampleRobolectricTest.verify changed account identity cannot login with old details and settings show new details"

      - name: Run Robolectric tests group 2C
        if: success()
        run: >
          timeout 3m gradle testDebugUnitTest --no-daemon --stacktrace --console=plain --info
          -Dbilling.skipFirebaseNetworkTests=true
          --tests "com.example.ExampleRobolectricTest.verify network and timeout errors during login never show mobile not registered"
          --tests "com.example.ExampleRobolectricTest.verify online unregistered mobile shows clear registration error message"
          --tests "com.example.ExampleRobolectricTest.verify silver payment rate is kg based and never multiplied by 1000"

      - name: Run Robolectric tests group 2D
        if: success()
        run: >
          timeout 3m gradle testDebugUnitTest --no-daemon --stacktrace --console=plain --info
          -Dbilling.skipFirebaseNetworkTests=true
          --tests "com.example.ExampleRobolectricTest.verify inline silver payment uses kg rate exactly once"
          --tests "com.example.ExampleRobolectricTest.normalize legacy Silver payment amount stored with wrong kg unit"

      - name: Assemble Debug APK
        if: success()
        run: timeout 6m gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: BILLING-STOCK-MANAGEMENT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

